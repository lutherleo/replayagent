[project]
name = "replayagent"
version = "0.1.0"
description = "Durable execution runtime for LLM agents: event-sourced SQLite history, deterministic replay, retries, timers, signals and versioning."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "replayagent contributors" }]
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]

[project.scripts]
replayagent = "replayagent.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/replayagent"]

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "pytest-cov==6.3.0",
    "hypothesis==6.140.2",
    "ruff==0.13.3",
    "mypy==1.18.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts", "examples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "C4", "PIE", "PL", "PT", "RET", "TRY", "N"]
ignore = [
    "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR2004", "PLW0603",
    "TRY003", "TRY300", "TRY301", "RET505", "RET506", "N818",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLC0415", "PT011", "B017", "N806", "PT018"]
"scripts/**" = ["T201", "PLC0415"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests", "scripts", "examples"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["tests.*", "scripts.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["replayagent"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@overload", "\\.\\.\\."]
